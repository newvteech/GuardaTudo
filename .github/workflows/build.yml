name: GuardaTudo build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair projeto
        run: tar -xJf p.txz && ls -la GuardaTudo
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            25
            21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Preparar (SDK do runner, Java 21 do Android Studio)
        working-directory: GuardaTudo
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          rm -f gradle/gradle-daemon-jvm.properties
          java -version
      - name: Build + testes
        working-directory: GuardaTudo
        run: gradle --no-daemon --stacktrace assembleDebug testDebugUnitTest
      - name: Lint
        if: always()
        continue-on-error: true
        working-directory: GuardaTudo
        run: gradle --no-daemon lintDebug
      - name: Resultado do lint
        if: always()
        working-directory: GuardaTudo
        run: |
          f=$(ls app/build/intermediates/lint_intermediate_text_report/debug/*/lint-results-debug.txt app/build/reports/lint-results-debug.txt 2>/dev/null | head -1)
          echo "arquivo: $f"
          if [ -n "$f" ]; then grep -E "Error:|errors" "$f" | head -60; tail -3 "$f"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guardatudo-resultados
          path: |
            GuardaTudo/app/build/outputs/apk/debug/*.apk
            GuardaTudo/app/build/reports/
          if-no-files-found: ignore
